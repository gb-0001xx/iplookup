<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Lookup</title>
<style>
  body {
    font-family: monospace;
    background: #111;
    color: #ddd;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 40px 20px;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
  }
  h2 {
    margin: 0 0 15px;
    font-size: 16px;
    color: #0ff;
  }
  input, button {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #333;
  }
  input {
    background: #111;
    color: #ddd;
    margin-bottom: 10px;
  }
  button {
    background: #0ff;
    color: #000;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .result { margin-top: 15px; font-size: 14px; line-height: 1.8; display: none; }
  .result div span { color: #888; }
  .error { color: #f55; font-size: 13px; margin-top: 10px; display: none; }
  a { color: #0ff; }
</style>
</head>
<body>

<div class="card">
  <h2>MY IP</h2>
  <button onclick="lookup()">Check my IP</button>
  <div class="error" id="err1"></div>
  <div class="result" id="res1"></div>
</div>

<div class="card">
  <h2>LOOKUP IP / DOMAIN</h2>
  <input id="target" placeholder="e.g. 8.8.8.8 or example.com">
  <button onclick="lookup(true)">Look up</button>
  <div class="error" id="err2"></div>
  <div class="result" id="res2"></div>
</div>

<script>
async function resolveHost(host) {
  const r = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(host)}&type=A`);
  const d = await r.json();
  const a = d.Answer && d.Answer.find(x => x.type === 1);
  if (!a) throw new Error('Could not resolve this domain.');
  return a.data;
}

function isIP(v) {
  return /^(\d{1,3}\.){3}\d{1,3}$/.test(v) || /^[0-9a-fA-F:]+:[0-9a-fA-F:]+$/.test(v);
}

function render(id, d) {
  const isp = d.connection?.isp || d.connection?.org || '?';
  const loc = (d.latitude && d.longitude) ? `${d.latitude},${d.longitude}` : null;
  document.getElementById(id).innerHTML = `
    <div><span>IP:</span> ${d.ip}</div>
    <div><span>ISP:</span> ${isp}</div>
    <div><span>Location:</span> ${d.city || '?'}, ${d.region || '?'} - ${d.country || '?'}</div>
    <div><span>Coords:</span> ${loc || '?'}
      ${loc ? `<a href="https://www.google.com/maps/search/?api=1&query=${loc}" target="_blank">[map]</a>` : ''}
    </div>`;
  document.getElementById(id).style.display = 'block';
}

async function lookup(withTarget = false) {
  const suffix = withTarget ? '2' : '1';
  const btn = event.target;
  const err = document.getElementById('err' + suffix);
  const res = document.getElementById('res' + suffix);

  err.style.display = 'none';
  res.style.display = 'none';
  btn.disabled = true;

  try {
    let url = 'https://ipwho.is/';
    if (withTarget) {
      const v = document.getElementById('target').value.trim();
      if (!v) throw new Error('Enter an IP or domain.');
      const ip = isIP(v) ? v : await resolveHost(v);
      url += ip;
    }

    const r = await fetch(url);
    const d = await r.json();
    if (d.success === false) throw new Error(d.message || 'Lookup failed.');

    render('res' + suffix, d);
  } catch (e) {
    err.innerText = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
